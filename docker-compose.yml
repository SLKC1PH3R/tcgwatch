# TCGWatch — déploiement Dokploy (application de type « Docker Compose », build depuis le repo).
#
# Variables : onglet « Environment » de Dokploy (voir .env.example).
# Le réseau `dokploy-network` est créé par Dokploy ; Traefik y route le domaine APP_DOMAIN et
# la base PostgreSQL gérée par Dokploy y est joignable (DATABASE_URL = son « Internal Connection URL »).

name: tcgwatch

x-common-env: &common-env
  NODE_ENV: production
  TZ: ${TZ:-Europe/Paris}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL est obligatoire (Internal Connection URL de la base Dokploy)}
  APP_URL: ${APP_URL:-https://tcg.digitalstack.cloud}

services:
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    # Chromium a besoin d'un /dev/shm plus grand que les 64 Mo par défaut.
    shm_size: 512mb
    environment:
      <<: *common-env
      RUN_MIGRATIONS: 'true'
      SEED_IF_EMPTY: ${SEED_IF_EMPTY:-true}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DEFAULT_CHECK_INTERVAL_MIN: ${DEFAULT_CHECK_INTERVAL_MIN:-30}
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-}
      SCRAPER_MIN_DELAY_MS: ${SCRAPER_MIN_DELAY_MS:-2000}
      SCRAPER_MAX_DELAY_MS: ${SCRAPER_MAX_DELAY_MS:-6000}
      SCRAPER_TIMEOUT_MS: ${SCRAPER_TIMEOUT_MS:-20000}
      PLAYWRIGHT_ENABLED: ${PLAYWRIGHT_ENABLED:-true}
      LISTINGS_CRON: ${LISTINGS_CRON:-* * * * *}
      TCGDEX_CRON: ${TCGDEX_CRON:-0 6 * * *}
      MARKET_CRON: ${MARKET_CRON:-30 6 * * *}
      TCGDEX_SERIES: ${TCGDEX_SERIES:-me,sv}
      POKETRACE_API_KEY: ${POKETRACE_API_KEY:-}
    networks: [dokploy-network]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      # Le worker applique les migrations : le web démarre une fois le worker lancé.
      worker:
        condition: service_started
    environment:
      <<: *common-env
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DEFAULT_CHECK_INTERVAL_MIN: ${DEFAULT_CHECK_INTERVAL_MIN:-30}
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-}
      POKETRACE_API_KEY: ${POKETRACE_API_KEY:-}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    expose:
      - '3000'
    networks: [dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.tcgwatch-web.rule=Host(`${APP_DOMAIN:-tcg.digitalstack.cloud}`)
      - traefik.http.routers.tcgwatch-web.entrypoints=websecure
      - traefik.http.routers.tcgwatch-web.tls.certresolver=letsencrypt
      - traefik.http.services.tcgwatch-web.loadbalancer.server.port=3000
      # Redirection HTTP → HTTPS
      - traefik.http.routers.tcgwatch-web-http.rule=Host(`${APP_DOMAIN:-tcg.digitalstack.cloud}`)
      - traefik.http.routers.tcgwatch-web-http.entrypoints=web
      - traefik.http.routers.tcgwatch-web-http.middlewares=tcgwatch-https
      - traefik.http.middlewares.tcgwatch-https.redirectscheme.scheme=https

volumes:
  uploads:

networks:
  dokploy-network:
    external: true
