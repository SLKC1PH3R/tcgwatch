# TCGWatch — déploiement Dokploy (application de type « Docker Compose », build depuis le repo).
#
# Variables : onglet « Environment » de Dokploy (voir .env.example).
# Le domaine (HTTPS Let's Encrypt) se déclare dans l'onglet « Domains » de Dokploy : service `web`,
# port 3000. Dokploy ajoute lui-même les labels Traefik au redéploiement.
# La base PostgreSQL gérée par Dokploy est joignable via `dokploy-network`
# (DATABASE_URL = son « Internal Connection URL »).

name: tcgwatch

x-common-env: &common-env
  NODE_ENV: production
  TZ: ${TZ:-Europe/Paris}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL est obligatoire (Internal Connection URL de la base Dokploy)}
  APP_URL: ${APP_URL:-https://tcg.digitalstack.cloud}
  # Notifications du navigateur : clés VAPID (le web publie la clé publique, le worker envoie).
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contact@digitalstack.cloud}

# Journaux Docker : 3 fichiers de 10 Mo au plus par service (sans limite par défaut).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      # Build : 64 Mo de /dev/shm par défaut, trop peu (SIGBUS pendant le build).
      shm_size: 1gb
    restart: unless-stopped
    logging: *logging
    # Chromium a besoin d'un /dev/shm plus grand que les 64 Mo par défaut.
    shm_size: 512mb
    environment:
      <<: *common-env
      RUN_MIGRATIONS: 'true'
      SEED_IF_EMPTY: ${SEED_IF_EMPTY:-true}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DEFAULT_CHECK_INTERVAL_MIN: ${DEFAULT_CHECK_INTERVAL_MIN:-30}
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-}
      SCRAPER_MIN_DELAY_MS: ${SCRAPER_MIN_DELAY_MS:-2000}
      SCRAPER_MAX_DELAY_MS: ${SCRAPER_MAX_DELAY_MS:-6000}
      SCRAPER_TIMEOUT_MS: ${SCRAPER_TIMEOUT_MS:-20000}
      PLAYWRIGHT_ENABLED: ${PLAYWRIGHT_ENABLED:-true}
      LISTINGS_CRON: ${LISTINGS_CRON:-* * * * *}
      TCGDEX_CRON: ${TCGDEX_CRON:-0 6 * * *}
      MARKET_CRON: ${MARKET_CRON:-30 6 * * *}
      HISTORY_CRON: ${HISTORY_CRON:-30 3 * * *}
      SNAPSHOT_RETENTION_DAYS: ${SNAPSHOT_RETENTION_DAYS:-14}
      ALERT_RETENTION_DAYS: ${ALERT_RETENTION_DAYS:-180}
      MARKET_MOVE_ALERT_PCT: ${MARKET_MOVE_ALERT_PCT:-15}
      TCGDEX_SERIES: ${TCGDEX_SERIES:-*}
      POKECARDEX_ENABLED: ${POKECARDEX_ENABLED:-true}
      POKECARDEX_CRON: ${POKECARDEX_CRON:-15 6 * * *}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-true}
      DISCOVERY_CRON: ${DISCOVERY_CRON:-45 6 * * *}
      CARDNEXUS_API_KEY: ${CARDNEXUS_API_KEY:-}
      POKETRACE_API_KEY: ${POKETRACE_API_KEY:-}
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
      EBAY_PICKUP_POSTCODE: ${EBAY_PICKUP_POSTCODE:-}
      EBAY_PICKUP_RADIUS_KM: ${EBAY_PICKUP_RADIUS_KM:-50}
      CARDMARKET_PRICE_GUIDE_ENABLED: ${CARDMARKET_PRICE_GUIDE_ENABLED:-true}
    networks: [dokploy-network]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      # Turbopack/PostCSS plantent en SIGBUS avec les 64 Mo de /dev/shm par défaut.
      shm_size: 1gb
    restart: unless-stopped
    logging: *logging
    depends_on:
      # Le worker applique les migrations : le web démarre une fois le worker lancé.
      worker:
        condition: service_started
    environment:
      <<: *common-env
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-TCGWatch <noreply@digitalstack.cloud>}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DEFAULT_CHECK_INTERVAL_MIN: ${DEFAULT_CHECK_INTERVAL_MIN:-30}
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-}
      CARDNEXUS_API_KEY: ${CARDNEXUS_API_KEY:-}
      POKETRACE_API_KEY: ${POKETRACE_API_KEY:-}
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
      EBAY_PICKUP_POSTCODE: ${EBAY_PICKUP_POSTCODE:-}
      EBAY_PICKUP_RADIUS_KM: ${EBAY_PICKUP_RADIUS_KM:-50}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    expose:
      - '3000'
    networks: [dokploy-network]

volumes:
  uploads:

networks:
  dokploy-network:
    external: true
