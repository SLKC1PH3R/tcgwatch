packages:
  - apps/*
  - packages/*

# pnpm n'exécute les scripts d'installation que des dépendances explicitement autorisées.
allowBuilds:
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - lucide-react@1.72.0
